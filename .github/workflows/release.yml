name: Release

on:
  release:
    types: [created]

jobs:
  build-and-release:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            asset_name: read-sync-linux
            executable: dist/read-sync
          - os: macos-latest
            asset_name: read-sync-macos
            executable: dist/read-sync
          - os: windows-latest
            asset_name: read-sync-windows.exe
            executable: dist/read-sync.exe
            
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -e .
    - name: Build Binary
      run: |
        pyinstaller --onefile read_sync/cli.py -n read-sync
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ matrix.executable }}
        name: Release ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
